syntax = "proto3";

package computehop.local.v1;

option go_package = "github.com/austinjiann/spare-compute/gen/go/computehop/local/v1;localv1";

// Request is one authenticated operation sent by a local ComputeHop client.
message Request {
  uint32 protocol_version = 1;
  string request_id = 2;
  bytes capability_token = 3;

  oneof operation {
    PingRequest ping = 10;
    SubmitJobRequest submit_job = 11;
    GetJobRequest get_job = 12;
    ListJobsRequest list_jobs = 13;
    CancelJobRequest cancel_job = 14;
    ReadJobLogsRequest read_job_logs = 15;
    ListDevicesRequest list_devices = 16;
    BeginPairingRequest begin_pairing = 17;
    ListPairingsRequest list_pairings = 18;
    ConfirmPairingRequest confirm_pairing = 19;
    RejectPairingRequest reject_pairing = 20;
    ListTrustedDevicesRequest list_trusted_devices = 21;
    UnpairDeviceRequest unpair_device = 22;
  }
}

// Response is the result corresponding to one request.
message Response {
  uint32 protocol_version = 1;
  string request_id = 2;
  Error error = 3;

  oneof result {
    PingResponse ping = 10;
    SubmitJobResponse submit_job = 11;
    GetJobResponse get_job = 12;
    ListJobsResponse list_jobs = 13;
    CancelJobResponse cancel_job = 14;
    ReadJobLogsResponse read_job_logs = 15;
    ListDevicesResponse list_devices = 16;
    BeginPairingResponse begin_pairing = 17;
    ListPairingsResponse list_pairings = 18;
    ConfirmPairingResponse confirm_pairing = 19;
    RejectPairingResponse reject_pairing = 20;
    ListTrustedDevicesResponse list_trusted_devices = 21;
    UnpairDeviceResponse unpair_device = 22;
  }
}

message PingRequest {}

message PingResponse {
  string daemon_version = 1;
}

message SubmitJobRequest {
  JobSpec spec = 1;
}

message SubmitJobResponse {
  Job job = 1;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  repeated JobState states = 1;
  uint32 limit = 2;
}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  Job job = 1;
}

message ReadJobLogsRequest {
  string job_id = 1;
  uint64 after_sequence = 2;
  uint32 limit = 3;
}

message ReadJobLogsResponse {
  Job job = 1;
  repeated JobLogRecord records = 2;
  bool has_more = 3;
}

message JobLogRecord {
  uint64 sequence = 1;
  JobLogStream stream = 2;
  bytes data = 3;
  int64 at_unix_nano = 4;
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated NearbyDevice devices = 1;
  DiscoveryState discovery_state = 2;
  string discovery_error = 3;
  int64 discovery_started_at_unix_nano = 4;
  repeated TrustedDevice trusted_devices = 5;
}

message BeginPairingRequest {
  string device_selector = 1;
}

message BeginPairingResponse {
  Pairing pairing = 1;
}

message ListPairingsRequest {}

message ListPairingsResponse {
  repeated Pairing pairings = 1;
}

message ConfirmPairingRequest {
  string pairing_selector = 1;
}

message ConfirmPairingResponse {
  Pairing pairing = 1;
}

message RejectPairingRequest {
  string pairing_selector = 1;
}

message RejectPairingResponse {
  Pairing pairing = 1;
}

message ListTrustedDevicesRequest {}

message ListTrustedDevicesResponse {
  repeated TrustedDevice devices = 1;
}

message UnpairDeviceRequest {
  string device_selector = 1;
}

message UnpairDeviceResponse {
  TrustedDevice device = 1;
}

message Pairing {
  string id = 1;
  string peer_device_id = 2;
  bytes peer_public_key = 3;
  string peer_name = 4;
  DeviceRole peer_role = 5;
  string verification_code = 6;
  PairingDirection direction = 7;
  PairingState state = 8;
  bool local_confirmed = 9;
  bool remote_confirmed = 10;
  int64 started_at_unix_nano = 11;
  int64 expires_at_unix_nano = 12;
  string failure = 13;
}

message TrustedDevice {
  string pair_id = 1;
  string device_id = 2;
  bytes public_key = 3;
  string name = 4;
  DeviceRole role = 5;
  DeviceTrustState trust_state = 6;
  int64 paired_at_unix_nano = 7;
  int64 updated_at_unix_nano = 8;
  int64 revoked_at_unix_nano = 9;
}

message NearbyDevice {
  string presence_id = 1;
  string name = 2;
  DeviceRole role = 3;
  uint32 protocol_version = 4;
  string instance = 5;
  string host_name = 6;
  repeated string addresses = 7;
  uint32 port = 8;
  bool endpoint_ready = 9;
  int64 first_seen_at_unix_nano = 10;
  int64 last_seen_at_unix_nano = 11;
  int64 expires_at_unix_nano = 12;
  DeviceTrustState trust_state = 13;
}

message JobSpec {
  string executable = 1;
  repeated string arguments = 2;
  string working_directory = 3;
  map<string, string> environment = 4;
  Executor executor = 5;
  string container_image = 6;
}

message Job {
  string id = 1;
  JobSpec spec = 2;
  JobState state = 3;
  int64 created_at_unix_nano = 4;
  int64 updated_at_unix_nano = 5;
  Failure failure = 6;
}

message Failure {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message Error {
  ErrorCode code = 1;
  string message = 2;
}

enum Executor {
  EXECUTOR_UNSPECIFIED = 0;
  EXECUTOR_NATIVE = 1;
  EXECUTOR_CONTAINER = 2;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_CREATED = 1;
  JOB_STATE_VALIDATING = 2;
  JOB_STATE_QUEUED = 3;
  JOB_STATE_SNAPSHOTTING = 4;
  JOB_STATE_TRANSFERRING = 5;
  JOB_STATE_STARTING = 6;
  JOB_STATE_RUNNING = 7;
  JOB_STATE_COLLECTING = 8;
  JOB_STATE_RESTORING = 9;
  JOB_STATE_SUCCEEDED = 10;
  JOB_STATE_FAILED = 11;
  JOB_STATE_CANCELLED = 12;
  JOB_STATE_REJECTED = 13;
  JOB_STATE_LOST = 14;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_INVALID_ARGUMENT = 1;
  ERROR_CODE_NOT_FOUND = 2;
  ERROR_CODE_CONFLICT = 3;
  ERROR_CODE_JOB_TERMINAL = 4;
  ERROR_CODE_INTERNAL = 5;
  ERROR_CODE_UNAUTHENTICATED = 6;
  ERROR_CODE_UNSUPPORTED_VERSION = 7;
  ERROR_CODE_PAIRING_UNAVAILABLE = 8;
}

enum JobLogStream {
  JOB_LOG_STREAM_UNSPECIFIED = 0;
  JOB_LOG_STREAM_STDOUT = 1;
  JOB_LOG_STREAM_STDERR = 2;
}

enum DeviceRole {
  DEVICE_ROLE_UNSPECIFIED = 0;
  DEVICE_ROLE_WORKER = 1;
  DEVICE_ROLE_ORCHESTRATOR = 2;
}

enum DeviceTrustState {
  DEVICE_TRUST_STATE_UNSPECIFIED = 0;
  DEVICE_TRUST_STATE_UNPAIRED = 1;
  DEVICE_TRUST_STATE_PAIRED = 2;
  DEVICE_TRUST_STATE_REVOKED = 3;
}

enum PairingDirection {
  PAIRING_DIRECTION_UNSPECIFIED = 0;
  PAIRING_DIRECTION_OUTBOUND = 1;
  PAIRING_DIRECTION_INBOUND = 2;
}

enum PairingState {
  PAIRING_STATE_UNSPECIFIED = 0;
  PAIRING_STATE_WAITING = 1;
  PAIRING_STATE_PAIRED = 2;
  PAIRING_STATE_REJECTED = 3;
  PAIRING_STATE_EXPIRED = 4;
  PAIRING_STATE_FAILED = 5;
}

enum DiscoveryState {
  DISCOVERY_STATE_UNSPECIFIED = 0;
  DISCOVERY_STATE_STARTING = 1;
  DISCOVERY_STATE_AVAILABLE = 2;
  DISCOVERY_STATE_UNAVAILABLE = 3;
}
