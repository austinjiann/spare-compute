syntax = "proto3";

package computehop.v1;

option go_package = "github.com/austinjiann/spare-compute/gen/go/computehop/v1;computehopv1";

// RemoteRequest is one bounded job-control operation sent by a paired
// orchestrator to a worker over an identity-pinned QUIC connection.
message RemoteRequest {
  uint32 protocol_version = 1;
  string request_id = 2;

  oneof operation {
    SubmitJobRequest submit_job = 10;
    GetJobRequest get_job = 11;
    ListJobsRequest list_jobs = 12;
    CancelJobRequest cancel_job = 13;
    ReadJobLogsRequest read_job_logs = 14;
    CheckSnapshotRequest check_snapshot = 15;
    PutChunkRequest put_chunk = 16;
    GetJobArtifactsRequest get_job_artifacts = 17;
    GetArtifactChunkRequest get_artifact_chunk = 18;
    AcknowledgeJobArtifactsRequest acknowledge_job_artifacts = 19;
  }
}

// RemoteResponse is correlated to exactly one RemoteRequest.
message RemoteResponse {
  uint32 protocol_version = 1;
  string request_id = 2;
  RemoteError error = 3;

  oneof result {
    SubmitJobResponse submit_job = 10;
    GetJobResponse get_job = 11;
    ListJobsResponse list_jobs = 12;
    CancelJobResponse cancel_job = 13;
    ReadJobLogsResponse read_job_logs = 14;
    CheckSnapshotResponse check_snapshot = 15;
    PutChunkResponse put_chunk = 16;
    GetJobArtifactsResponse get_job_artifacts = 17;
    GetArtifactChunkResponse get_artifact_chunk = 18;
    AcknowledgeJobArtifactsResponse acknowledge_job_artifacts = 19;
  }
}

message SubmitJobRequest {
  JobSpec spec = 1;
  SnapshotManifest snapshot = 2;
  string working_subdirectory = 3;
}

message CheckSnapshotRequest {
  string manifest_id = 1;
  repeated string chunk_digests = 2;
}

message CheckSnapshotResponse {
  repeated string missing_chunk_digests = 1;
  repeated ChunkEncoding accepted_chunk_encodings = 2;
}

message PutChunkRequest {
  string digest = 1;
  bytes data = 2;
  ChunkEncoding encoding = 3;
  uint32 uncompressed_size = 4;
}

message PutChunkResponse {
  string digest = 1;
}

message GetJobArtifactsRequest {
  string job_id = 1;
}

message GetJobArtifactsResponse {
  Job job = 1;
  SnapshotManifest artifacts = 2;
  int64 collected_at_unix_nano = 3;
}

message GetArtifactChunkRequest {
  string job_id = 1;
  string digest = 2;
  repeated ChunkEncoding accepted_encodings = 3;
}

message GetArtifactChunkResponse {
  string digest = 1;
  bytes data = 2;
  ChunkEncoding encoding = 3;
  uint32 uncompressed_size = 4;
}

message AcknowledgeJobArtifactsRequest {
  string job_id = 1;
}

message AcknowledgeJobArtifactsResponse {
  string job_id = 1;
}

enum ChunkEncoding {
  CHUNK_ENCODING_UNSPECIFIED = 0;
  CHUNK_ENCODING_IDENTITY = 1;
  CHUNK_ENCODING_ZSTD = 2;
}

message SnapshotManifest {
  uint32 version = 1;
  string manifest_id = 2;
  repeated SnapshotFile files = 3;
  int64 total_bytes = 4;
}

message SnapshotFile {
  string path = 1;
  uint32 mode = 2;
  int64 size = 3;
  repeated SnapshotChunk chunks = 4;
}

message SnapshotChunk {
  string digest = 1;
  uint32 size = 2;
}

message SubmitJobResponse {
  Job job = 1;
}

message GetJobRequest {
  string job_id = 1;
}

message GetJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  repeated JobState states = 1;
  uint32 limit = 2;
}

message ListJobsResponse {
  repeated Job jobs = 1;
}

message CancelJobRequest {
  string job_id = 1;
}

message CancelJobResponse {
  Job job = 1;
}

message ReadJobLogsRequest {
  string job_id = 1;
  uint64 after_sequence = 2;
  uint32 limit = 3;
}

message ReadJobLogsResponse {
  Job job = 1;
  repeated JobLogRecord records = 2;
  bool has_more = 3;
}

message JobLogRecord {
  uint64 sequence = 1;
  JobLogStream stream = 2;
  bytes data = 3;
  int64 at_unix_nano = 4;
}

message JobSpec {
  string executable = 1;
  repeated string arguments = 2;
  string working_directory = 3;
  map<string, string> environment = 4;
  Executor executor = 5;
  string container_image = 6;
  repeated string outputs = 7;
}

message Job {
  string id = 1;
  JobSpec spec = 2;
  JobState state = 3;
  int64 created_at_unix_nano = 4;
  int64 updated_at_unix_nano = 5;
  Failure failure = 6;
  JobProgress progress = 7;
}

message JobProgress {
  JobProgressPhase phase = 1;
  int64 completed_bytes = 2;
  int64 total_bytes = 3;
  int64 updated_at_unix_nano = 4;
}

message Failure {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message RemoteError {
  RemoteErrorCode code = 1;
  string message = 2;
}

enum Executor {
  EXECUTOR_UNSPECIFIED = 0;
  EXECUTOR_NATIVE = 1;
  EXECUTOR_CONTAINER = 2;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_CREATED = 1;
  JOB_STATE_VALIDATING = 2;
  JOB_STATE_QUEUED = 3;
  JOB_STATE_SNAPSHOTTING = 4;
  JOB_STATE_TRANSFERRING = 5;
  JOB_STATE_STARTING = 6;
  JOB_STATE_RUNNING = 7;
  JOB_STATE_COLLECTING = 8;
  JOB_STATE_RESTORING = 9;
  JOB_STATE_SUCCEEDED = 10;
  JOB_STATE_FAILED = 11;
  JOB_STATE_CANCELLED = 12;
  JOB_STATE_REJECTED = 13;
  JOB_STATE_LOST = 14;
}

enum JobProgressPhase {
  JOB_PROGRESS_PHASE_UNSPECIFIED = 0;
  JOB_PROGRESS_PHASE_SNAPSHOT = 1;
  JOB_PROGRESS_PHASE_UPLOAD = 2;
  JOB_PROGRESS_PHASE_DOWNLOAD = 3;
  JOB_PROGRESS_PHASE_RESTORE = 4;
  JOB_PROGRESS_PHASE_COLLECT = 5;
}

enum JobLogStream {
  JOB_LOG_STREAM_UNSPECIFIED = 0;
  JOB_LOG_STREAM_STDOUT = 1;
  JOB_LOG_STREAM_STDERR = 2;
}

enum RemoteErrorCode {
  REMOTE_ERROR_CODE_UNSPECIFIED = 0;
  REMOTE_ERROR_CODE_INVALID_ARGUMENT = 1;
  REMOTE_ERROR_CODE_NOT_FOUND = 2;
  REMOTE_ERROR_CODE_CONFLICT = 3;
  REMOTE_ERROR_CODE_JOB_TERMINAL = 4;
  REMOTE_ERROR_CODE_INTERNAL = 5;
  REMOTE_ERROR_CODE_UNAUTHENTICATED = 6;
  REMOTE_ERROR_CODE_UNSUPPORTED_VERSION = 7;
}
