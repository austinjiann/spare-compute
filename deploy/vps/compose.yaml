name: computehop-connectivity

services:
  rendezvous:
    build:
      context: ../..
      dockerfile: deploy/connectivity/Dockerfile
      args:
        VERSION: ${COMPUTEHOP_VERSION:-dev}
    restart: unless-stopped
    environment:
      PORT: "8080"
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - edge

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      rendezvous:
        condition: service_healthy
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      CONNECTIVITY_DOMAIN: ${CONNECTIVITY_DOMAIN:?set CONNECTIVITY_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - edge

  coturn:
    image: coturn/coturn:4.14.0-r0-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_REALM: ${TURN_REALM:?set TURN_REALM in .env}
      VPS_PUBLIC_IP: ${VPS_PUBLIC_IP:?set VPS_PUBLIC_IP in .env}
      TURN_RELAY_IP: ${TURN_RELAY_IP:-}
    entrypoint:
      - /bin/sh
      - /opt/computehop/coturn-entrypoint.sh
    volumes:
      - ./coturn-entrypoint.sh:/opt/computehop/coturn-entrypoint.sh:ro
    secrets:
      - turn_shared_secret
    read_only: true
    tmpfs:
      - /tmp:size=1m,mode=0700
      - /var/lib/coturn:size=8m,mode=0700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  edge:

volumes:
  caddy_data:
  caddy_config:

secrets:
  turn_shared_secret:
    file: ${TURN_SECRET_FILE:-./secrets/turn_shared_secret}
