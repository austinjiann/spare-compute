name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-check:
    name: PR check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: true

      - name: Run PR validation
        run: make pr-check

      - name: Build worker archives
        run: make worker-archives
